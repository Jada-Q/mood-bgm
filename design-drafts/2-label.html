<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood BGM — Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --void: #0c0c10; --white: #f3f1ec; --dim: #6a6a78; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: var(--white); font-family: "Syne", sans-serif; overflow-x: hidden; }
  .mono { font-family: "Space Mono", monospace; }

  /* fluid blob hero */
  .hero { position: relative; min-height: 88vh; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; mix-blend-mode: screen; }
  .b1 { width: 600px; height: 600px; background: radial-gradient(circle, #c026d3, transparent 70%); top: -120px; right: -80px; animation: drift1 18s ease-in-out infinite; }
  .b2 { width: 520px; height: 520px; background: radial-gradient(circle, #0891b2, transparent 70%); bottom: -140px; left: -60px; animation: drift2 22s ease-in-out infinite; }
  .b3 { width: 420px; height: 420px; background: radial-gradient(circle, #db2777, transparent 70%); top: 30%; left: 40%; animation: drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,60px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,-50px) scale(1.2); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-70px) scale(0.85); } }

  nav { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 32px 56px; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); z-index: 3; }
  .hero-inner { position: relative; z-index: 2; }
  .hero h1 { font-size: clamp(72px, 14vw, 200px); font-weight: 800; line-height: 0.82; letter-spacing: -0.03em; }
  .hero .sub { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); margin-top: 24px; }
  .hero .desc { font-size: 16px; color: var(--dim); max-width: 380px; margin-top: 20px; line-height: 1.6; }

  /* transport floating */
  .transport { position: relative; z-index: 2; margin-top: 56px; display: flex; align-items: center; gap: 28px; }
  .transport .play { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--white); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.3s; }
  .transport .play:hover { background: var(--white); color: var(--void); }
  .transport .now { font-size: 14px; letter-spacing: 0.1em; }
  .transport .now span { color: #db2777; }

  /* mood grid */
  .moods-section { padding: 96px 56px 120px; position: relative; z-index: 2; }
  .moods-section h2 { font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--dim); margin-bottom: 40px; }
  .moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .mood { aspect-ratio: 1; border: 1px solid #23232c; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: 0.4s; position: relative; overflow: hidden; }
  .mood::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: 0.4s; }
  .mood:hover { border-color: transparent; transform: translateY(-4px); }
  .mood:hover::before { opacity: 0.25; }
  .mood.m1::before { background: radial-gradient(circle at 30% 20%, #c026d3, transparent 70%); }
  .mood.m2::before { background: radial-gradient(circle at 30% 20%, #0891b2, transparent 70%); }
  .mood.m3::before { background: radial-gradient(circle at 30% 20%, #db2777, transparent 70%); }
  .mood.m4::before { background: radial-gradient(circle at 30% 20%, #7c3aed, transparent 70%); }
  .mood .num { font-size: 11px; color: var(--dim); position: relative; }
  .mood .label { position: relative; }
  .mood .cn { font-size: 28px; font-weight: 700; }
  .mood .en { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
  <section class="hero">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <nav class="mono"><span>Mood BGM</span><span>Contact · JP / EN</span></nav>
    <div class="hero-inner">
      <h1>MOOD<br>BGM</h1>
      <div class="sub mono">Synthesised · Never Repeating</div>
      <p class="desc">情绪藏在结构里，不在音色里。一架合成器，奏尽每一种心情。</p>
      <div class="transport">
        <div class="play">▷</div>
        <div class="now mono">NOW · <span>欢快 CHEERFUL</span> · seed 4F2A</div>
      </div>
    </div>
  </section>

  <section class="moods-section">
    <h2 class="mono">Select a Mood</h2>
    <div class="moods">
      <div class="mood m1"><div class="num mono">01</div><div class="label"><div class="cn">欢快</div><div class="en mono">Cheerful</div></div></div>
      <div class="mood m3"><div class="num mono">02</div><div class="label"><div class="cn">心碎</div><div class="en mono">Heartbroken</div></div></div>
      <div class="mood m2"><div class="num mono">03</div><div class="label"><div class="cn">冥想</div><div class="en mono">Meditative</div></div></div>
      <div class="mood m4"><div class="num mono">04</div><div class="label"><div class="cn">太空</div><div class="en mono">Space</div></div></div>
      <div class="mood m1"><div class="num mono">05</div><div class="label"><div class="cn">胜利</div><div class="en mono">Victory</div></div></div>
      <div class="mood m3"><div class="num mono">06</div><div class="label"><div class="cn">梦幻</div><div class="en mono">Dreamy</div></div></div>
    </div>
  </section>
</body>
</html>
